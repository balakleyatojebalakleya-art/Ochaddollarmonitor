name: Test Telegram notification

on:
  workflow_dispatch:

jobs:
  send-test-message:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          if not token or not chat_id:
              raise SystemExit("Не задані TELEGRAM_BOT_TOKEN або TELEGRAM_CHAT_ID у GitHub Secrets.")

          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat_id, "text": "✅ Тестове повідомлення: Telegram-сповіщення монітора Ощадбанку працює!"},
              timeout=20,
          )
          response.raise_for_status()
          print("Тестове повідомлення успішно надіслано.")
          PY
